  sections:
    Summary:
      - bullet: ML Scientist / AI Engineer with a Ph.D. in Computer Science and 6+ years across industry research and product, focused on making LLM systems accurate and auditable enough to trust. Led a data-quality pipeline over billions of tokens of LLM training data at Amazon AI; built LLM-powered product features for a platform serving medical device manufacturers at Flinn.ai; open-sourced Sift, a hybrid BM25 and dense retrieval system whose agent answers only from retrieved passages, with a source and page citation on every claim. Working depth in modern LLM internals and inference efficiency (KV-cache, speculative decoding, FlashAttention) and in agentic system design (MCP, persistent memory, tool orchestration). Publications at AAAI, NAACL, and EMNLP.

    Experience:
      - company: Independent
        position: Applied AI & LLM Systems
        location: Berlin, Germany
        start_date: 2025-07
        end_date: present
        highlights:
          - "Built and open-sourced [Sift](https://github.com/shailzajolly/Sift): grounded question-answering over technical PDF corpora. Docling chunking, hybrid BM25 and dense (Chroma) retrieval, cross-encoder reranking, served over MCP to an agent that answers only from retrieved passages, with a source and page citation on every claim."
          - "Built an agentic tutoring system in daily use: an LLM agent orchestrating retrieval over a structured knowledge base, persistent memory of errors and progress, adaptive lesson selection that targets weak areas, and voice I/O (faster-whisper ASR, edge-tts TTS)."
          - "Published technical writing on LLM internals and systems: attention mechanisms, data quality for LLM training, and the shift from generative to agentic AI."
          - "Deepened modern LLM architecture and inference-efficiency internals through Stanford coursework: KV-cache, speculative decoding, FlashAttention."

      - company: Flinn.ai
