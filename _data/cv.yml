    Summary:
      - bullet: Builder and researcher with a Ph.D. in CS and 6+ years spanning academic research and industry, working at the intersection of science, engineering, and product. Specializes in LLMs, Generative AI, and scalable data pipelines, with hands-on depth in modern LLM architectures, efficiency techniques (KV-cache, speculative decoding, FlashAttention), and agentic system design. Pairs a track record of top-tier publications (AAAI, NAACL, EMNLP) with shipping production systems and translating technical work into clear business outcomes.

    Experience:
      - company: Independent
        position: Applied AI & LLM Systems
        location: Berlin, Germany
        start_date: 2025-07
        end_date: present
        highlights:
          - Explored problem spaces in LLM evaluation, enterprise AI, and agentic systems by building working prototypes: [Sift](https://github.com/shailzajolly/Sift), a hybrid retrieval system for technical documentation, and a personal AI learning tool built after finding the gap in existing apps.
          - Deepened LLM architecture fundamentals (Stanford) including efficiency internals: KV-cache, speculative decoding, FlashAttention.

      - company: Flinn.ai
        position: Senior AI Engineer
        location: Berlin, Germany
        start_date: 2025-01
        end_date: 2025-06
        highlights:
          - Led development of AI-driven product features including data extraction from medical research papers and multilingual complaint monitoring.
          - Partnered with product and backend teams to scope problems, define success metrics, and deliver end-to-end features within an agile product lifecycle.
          - Navigated cost-performance tradeoffs under production constraints and learned to translate between engineers, product managers, and domain experts who each speak a fundamentally different language.

